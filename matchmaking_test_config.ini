[MatchmakingAPI]
# Matchmaking API Configuration for Testing
# Copy this file to your BBCF root directory and rename to matchmaking_config.ini

# API Server Settings
api_base_url=http://localhost:8080
api_timeout_ms=5000
enable_api_calls=true

# Player Settings
default_region=NA
default_rating=1500
region_only_mode=false

# Valid regions: NA, EU, JP, SA, OCE, ASIA, ALL
# Valid game modes: FT1, FT2, FT3, FT5, FT10

# Testing Settings
debug_logging=true
fake_lobby_id=109775241072023652
test_mode=false

# When test_mode=true, uses fake data instead of real Steam/game data
# Useful for testing API without being in-game

[TestData]
# Test data used when test_mode=true
test_steam_id=76561198123456789
test_lobby_id=109775241072023652
test_room_name=RANKED
test_player_name=TestPlayer

[Regions]
# Region display names
NA=North America
EU=Europe
JP=Japan
SA=South America
OCE=Oceania
ASIA=Asia
ALL=Global

[GameModes]
# Game mode configurations
FT1=First to 1
FT2=First to 2
FT3=First to 3
FT5=First to 5
FT10=First to 10

[Logging]
# Logging levels: 0=Off, 1=Error, 2=Warn, 3=Info, 4=Debug, 5=Verbose
log_level=3
log_api_requests=true
log_room_events=true
log_steam_events=true

# Log file settings
log_file=matchmaking_api.log
max_log_size_mb=10
rotate_logs=true
